name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Build Web App (Vite + Tailwind)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 5. Setup Capacitor Android
        run: |
          npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Fasco Sanwira Mobile" "com.fascosanwira.mobile" --web-dir dist
          npx cap add android

      - name: 6. Inject Logo & Sync
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const iconSrc = 'public/fasco-logo.png';
          if (fs.existsSync(iconSrc)) {
            const iconData = fs.readFileSync(iconSrc);
            const resDir = path.join('android', 'app', 'src', 'main', 'res');
            const folders = ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi'];
            folders.forEach(f => {
              const target = path.join(resDir, f);
              if (!fs.existsSync(target)) fs.mkdirSync(target, { recursive: true });
              fs.writeFileSync(path.join(target, 'ic_launcher.png'), iconData);
              fs.writeFileSync(path.join(target, 'ic_launcher_round.png'), iconData);
            });
          }
          "
          npx cap sync android

      - name: 7. Compile Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: Fasco-Sanwira-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
