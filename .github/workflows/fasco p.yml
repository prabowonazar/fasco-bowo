name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Build Web App (Vite + Tailwind)
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 5. Setup Capacitor Android
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Fasco Sanwira Mobile" "com.fascosanwira.mobile" --web-dir dist
          npx cap add android

      - name: 6. Inject Brand Icons to Android App
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const iconSrc = 'public/fasco-logo.png';
          if (fs.existsSync(iconSrc)) {
            const iconData = fs.readFileSync(iconSrc);
            const resDir = path.join('android', 'app', 'src', 'main', 'res');
            const mipmapFolders = [
              'mipmap-mdpi',
              'mipmap-hdpi',
              'mipmap-xhdpi',
              'mipmap-xxhdpi',
              'mipmap-xxxhdpi'
            ];
            mipmapFolders.forEach(folder => {
              const targetFolder = path.join(resDir, folder);
              if (!fs.existsSync(targetFolder)) {
                fs.mkdirSync(targetFolder, { recursive: true });
              }
              fs.writeFileSync(path.join(targetFolder, 'ic_launcher.png'), iconData);
              fs.writeFileSync(path.join(targetFolder, 'ic_launcher_round.png'), iconData);
              fs.writeFileSync(path.join(targetFolder, 'ic_launcher_foreground.png'), iconData);
            });
            console.log('App icons injected into Android project successfully');
          }
          "

      - name: 7. Sync Assets to Android
        run: |
          npx cap sync android

      - name: 8. Accept Android Licenses & Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ./gradlew assembleDebug --no-daemon

      - name: 9. Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fasco-Sanwira-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
