name: Build Android APK

# Workflow akan berjalan setiap ada 'push' atau 'pull request' di branch main/master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Memungkinkan menjalankan workflow secara manual dari tab Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Mengatur versi Java / JDK yang dibutuhkan oleh Gradle
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Memberikan izin akses (permission) pada gradlew agar bisa dieksekusi
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # 4. Proses Build APK (Debug)
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 5. Mengunggah hasil APK agar bisa di-download di tab Actions GitHub
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
